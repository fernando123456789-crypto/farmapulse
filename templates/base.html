<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FarmaPulse - Tu Red Compartida para Medicamentos de Confianza{% endblock %}</title>
<meta name="description" content="FarmaPulse: compara precios de medicamentos en farmacias del Perú y ahorra en tus tratamientos.">

<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="{{ asset_url('css/tailwind.css') }}" integrity="{{ asset_integrity('css/tailwind.css') }}" crossorigin="anonymous">
<link rel="stylesheet" href="{{ asset_url('vendor/fontawesome/css/all.min.css') }}" integrity="{{ asset_integrity('vendor/fontawesome/css/all.min.css') }}" crossorigin="anonymous">
<link rel="stylesheet" href="{{ asset_url('vendor/poppins/poppins.css') }}" integrity="{{ asset_integrity('vendor/poppins/poppins.css') }}" crossorigin="anonymous">
<link rel="stylesheet" href="{{ asset_url('css/styles.css') }}" integrity="{{ asset_integrity('css/styles.css') }}" crossorigin="anonymous">
{% block extra_head %}{% endblock %}
</head>
<body class="font-[Poppins] bg-white text-slate-800">

{% block content %}{% endblock %}

<footer class="bg-fpDark text-slate-200 mt-16">
  <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-plus-square text-fpGreen text-xl"></i>
      <span class="font-bold text-white">FarmaPulse</span>
    </div>
    <p class="text-sm text-slate-400 text-center">
      &copy; 2026 FarmaPulse. Los precios mostrados son referenciales y pueden variar según disponibilidad.
    </p>
    <div class="flex gap-4 text-lg">
      <i class="fa-brands fa-facebook hover:text-fpGreen cursor-pointer"></i>
      <i class="fa-brands fa-instagram hover:text-fpGreen cursor-pointer"></i>
      <i class="fa-brands fa-whatsapp hover:text-fpGreen cursor-pointer"></i>
    </div>
  </div>
</footer>

{% include "_auth_modales.html" %}


<div id="botonWhatsapp"></div>

{% block extra_scripts %}{% endblock %}
<script src="{{ asset_url('js/auth.js') }}" integrity="{{ asset_integrity('js/auth.js') }}" crossorigin="anonymous"></script>
<script src="{{ asset_url('js/whatsapp.js') }}" integrity="{{ asset_integrity('js/whatsapp.js') }}" crossorigin="anonymous"></script>
<script src="{{ asset_url('js/main.js') }}" integrity="{{ asset_integrity('js/main.js') }}" crossorigin="anonymous"></script>
</body>
</html>
