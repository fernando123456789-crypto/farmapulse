name: Capturar precios nocturno

on:
  schedule:
    # 18:00 hora Perú = 23:00 UTC (Perú es UTC-5 todo el año, sin horario de verano)
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions, para probar

permissions:
  contents: read

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar captura de precios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/capturar_precios.py
