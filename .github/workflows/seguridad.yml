name: Compruebo seguridad y regresiones
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-not-a-production-secret-1234567890
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-only-public-key
      IDENTITY_SECURITY_DB: instance/identity-tests.sqlite3
      PAYMENTS_DB: instance/payment-tests.sqlite3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalo dependencias y el auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Compruebo backend y controles de acceso
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compruebo tarjeta, checkout, recuperación, cobertura y XSS
        run: |
          node tests/test_mercado_pago.js
          node tests/test_checkout_flow.js
          node tests/test_auth_recovery.js
          node tests/test_delivery_area.js
          node tests/test_xss.js
      - name: Compruebo vulnerabilidades conocidas
        run: python -m pip_audit -r requirements.txt
